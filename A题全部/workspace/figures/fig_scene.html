<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;padding:0;width:fit-content;height:fit-content;background:transparent}
.fig,.fig *{font-family:"Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",
  "PingFang SC","Segoe UI",sans-serif;font-style:normal!important;box-sizing:border-box}
:root{--ac:hsl(224,45%,42%);--edge:#000;--txt:#000}
.fig{width:fit-content;height:fit-content;background:transparent;padding:16px}
.wrap{display:grid;grid-template-columns:186px 316px;column-gap:16px;align-items:stretch}

.hd{display:flex;align-items:baseline;gap:6px;padding-bottom:3px;
  border-bottom:1px solid var(--edge);margin-bottom:8px}
.hn{font-size:13px;font-weight:600;color:var(--txt);letter-spacing:.05em}
.hn::before{color:var(--ac);font-weight:700;letter-spacing:.5px}
.h1 .hn::before{content:"Ⅰ "}
.h2 .hn::before{content:"Ⅱ "}
.h3 .hn::before{content:"Ⅲ "}

/* ---------- 左列：热风环境（节点等分拉伸，与右列同高） ---------- */
.lc{display:flex;flex-direction:column;min-width:0}
.air{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.strm{height:7px;border-radius:3px;
  background-image:repeating-linear-gradient(115deg,var(--ac) 0 1.1px,transparent 1.1px 7px)}
.strm.s2{background-image:repeating-linear-gradient(115deg,var(--ac) 0 1.1px,transparent 1.1px 10px)}
.stack{display:flex;flex-direction:column;gap:9px;flex:1}
.n{background:#fff;border:1.3px solid var(--edge);border-radius:5px;padding:6px 8px;
  display:flex;flex-direction:column;gap:2px;justify-content:center;min-width:0;flex:1}
.n.aux{border:1px dashed var(--edge)}
.ttl{font-size:13.5px;font-weight:600;color:var(--txt);line-height:1.26}
.sub{font-size:12px;font-weight:400;color:var(--txt);letter-spacing:.03em;line-height:1.3}

/* ---------- 右列：药材圆柱截面 + 表面交换 ---------- */
.rc{display:flex;flex-direction:column;min-width:0}
.ex{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;column-gap:4px}
.ex .lab{font-size:12.5px;color:var(--txt);line-height:1.26}
.ex .lab.r{text-align:right}
.ex .lab .k{font-weight:600;color:var(--ac)}
/* 竖直引线 + 箭头：把注记与圆形连起来 */
.conn{display:flex;flex-direction:column;align-items:center;gap:0}
.cline{width:0;height:13px;border-left:1.2px dotted var(--edge)}
.chead{width:0;height:0;border-top:7px solid var(--ac);
  border-left:5px solid transparent;border-right:5px solid transparent}

.disc{width:222px;height:222px;border-radius:50%;border:1.6px solid var(--edge);
  background:#fff;display:grid;place-items:center;margin:5px auto}
.d2{width:164px;height:164px;border-radius:50%;border:1.2px dashed var(--ac);
  display:grid;place-items:center}
.d3{width:106px;height:106px;border-radius:50%;border:1px dotted var(--edge);
  display:grid;place-items:center}
.core{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.ax{font-size:12px;color:var(--txt);letter-spacing:.03em}
.axc{font-size:12.5px;font-weight:600;color:var(--ac)}

/* 半径标尺：两端立杆 + 横线，标签落在杆下 */
.rule{width:222px;margin:3px auto 0;display:flex;flex-direction:column}
.rline{display:grid;grid-template-columns:8px 1fr 8px;align-items:end;height:9px}
.rpost{width:0;height:9px;border-left:1.2px solid var(--edge);justify-self:center}
.rmid{height:0;border-top:1.2px solid var(--edge);align-self:center}
.rtag{display:flex;justify-content:space-between;font-size:12px;color:var(--txt);
  margin-top:2px}
</style>
<style>
/* ---------- 底部：收缩边界（三格等宽等高，跨满两列） ---------- */
.band{width:518px;margin-top:12px}
.shr{display:grid;grid-template-columns:repeat(3,1fr);column-gap:26px;
  align-items:stretch;position:static}
.pill{border:1.1px solid var(--edge);border-radius:5px;padding:6px 8px;background:#fff;
  font-size:12.5px;color:var(--txt);text-align:center;line-height:1.26;
  display:flex;flex-direction:column;justify-content:center;gap:1px}
.pill.on{border:1.1px solid var(--ac);border-top:2.2px solid var(--ac);
  color:var(--ac);font-weight:600}
/* 相邻格之间的推进箭头，落在 26px 间隙内 */
.seq{display:grid;grid-template-columns:repeat(3,1fr);column-gap:26px;
  margin-bottom:6px;align-items:center}
.gap{display:flex;align-items:center;justify-content:center;gap:3px}
.gline{width:14px;height:0;border-top:1.2px solid var(--edge)}
.ghead{width:0;height:0;border-left:6px solid var(--ac);
  border-top:4px solid transparent;border-bottom:4px solid transparent}
.arrows{display:grid;grid-template-columns:1fr 26px 1fr 26px 1fr;
  align-items:center;margin:7px 0}
</style>
</head>
<body>
<div class="fig" data-mh-palette="modern">
  <div class="wrap">

    <div class="lc" data-mh-col="left">
      <div class="hd h1"><span class="hn">热风环境</span></div>
      <div class="air" aria-hidden="true">
        <div class="strm"></div><div class="strm s2"></div><div class="strm"></div>
      </div>
      <div class="stack">
        <div class="n" data-mh-node="true">
          <div class="ttl">送风温度</div>
          <div class="sub">按时程给定，驱动升温</div>
        </div>
        <div class="n" data-mh-node="true">
          <div class="ttl">空气湿度</div>
          <div class="sub">决定表面蒸汽压差</div>
        </div>
        <div class="n aux" data-mh-node="true">
          <div class="ttl">对流系数</div>
          <div class="sub">传热与传质各取一支</div>
        </div>
      </div>
    </div>

    <div class="rc" data-mh-col="right">
      <div class="hd h2"><span class="hn">药材截面与表面交换</span></div>

      <div class="ex">
        <div class="lab r"><span class="k">对流换热</span><br>热流进入表面</div>
        <div class="conn"><div class="cline"></div><div class="chead"></div></div>
        <div class="lab">表面温度上升</div>
      </div>

      <div class="disc">
        <div class="d2">
          <div class="d3">
            <div class="core">
              <div class="axc">对称轴</div>
              <div class="ax">零梯度</div>
            </div>
          </div>
        </div>
      </div>

      <div class="rule">
        <div class="rline">
          <div class="rpost"></div><div class="rmid"></div><div class="rpost"></div>
        </div>
        <div class="rtag"><span>中心</span><span>表面</span></div>
      </div>

      <div class="ex" style="margin-top:7px">
        <div class="lab r">内部水分向外扩散</div>
        <div class="conn"><div class="chead"></div><div class="cline"></div></div>
        <div class="lab"><span class="k">对流传质</span><br>水蒸气脱离表面</div>
      </div>
    </div>

  </div>

  <div class="band" data-mh-row="bottom">
    <div class="hd h3"><span class="hn">干燥推进中的边界内移</span></div>
    <div class="arrows" aria-hidden="true">
      <div></div>
      <div class="gap"><div class="gline"></div><div class="ghead"></div></div>
      <div></div>
      <div class="gap"><div class="gline"></div><div class="ghead"></div></div>
      <div></div>
    </div>
    <div class="shr">
      <div class="pill" data-mh-node="true">初始半径<br>表面湿润</div>
      <div class="pill" data-mh-node="true">失水收缩<br>半径减小</div>
      <div class="pill on" data-mh-node="true">动边界<br>随时间内移</div>
    </div>
  </div>
</div>
</body>
</html>
